name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    # tests/*.test.ts corren contra el Supabase real (transacción con
    # ROLLBACK por test, no dejan datos — ver tests/helpers/db.ts). Sin los
    # 5 secrets de conexión seteados en el repo, este job falla: agregarlos
    # en Settings → Secrets and variables → Actions.
    #
    # continue-on-error: silenciado a pedido de Walter el 2026-08-15 — sin
    # los secrets, cada push mandaba un correo de "workflow failed" aunque
    # typecheck+lint pasaran bien. SACAR esta línea en cuanto se agreguen
    # los secrets, para que test vuelva a bloquear el workflow si falla.
    continue-on-error: true
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
